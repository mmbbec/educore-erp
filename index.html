<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCore ERP - Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }
    .brand { text-align: center; margin-bottom: 2rem; }
    .brand h1 { font-size: 1.75rem; font-weight: 700; color: #1e293b; }
    .brand p { color: #64748b; font-size: 0.875rem; margin-top: 0.25rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 0.5rem; }
    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #1e293b;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    .btn-submit {
      width: 100%;
      padding: 0.875rem;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }
    .btn-submit:hover { background: #1d4ed8; }
    .btn-submit:disabled { background: #94a3b8; cursor: not-allowed; }
    .alert { padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
    .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .demo-creds {
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid #e2e8f0;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand">
      <h1>EduCore ERP</h1>
      <p>Institutional Management System</p>
    </div>

    <div id="alertBox" class="alert alert-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="role">Select Role</label>
        <select id="role" required>
          <option value="Admin">System Admin / Admin</option>
          <option value="Principal">Principal</option>
          <option value="HOD">HOD</option>
          <option value="Faculty">Faculty</option>
          <option value="Student">Student</option>
          <option value="Parent">Parent</option>
        </select>
      </div>

      <div class="form-group">
        <label for="email">Institutional Email</label>
        <input type="email" id="email" placeholder="admin@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" id="loginBtn" class="btn-submit">Sign In to Dashboard</button>
    </form>

    <div class="demo-creds">
      <strong>Default Admin Account:</strong><br>
      Email: <code>admin@example.com</code> | Pass: <code>Admin@123</code>
    </div>
  </div>

  <script>
    // Set your Google Apps Script Web App Deployment URL
    const API_URL = "https://script.google.com/macros/s/AKfycbwW62c3BqM9V5bY5T50Qz5eE-example/exec";

    const form = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const alertBox = document.getElementById("alertBox");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      loginBtn.disabled = true;
      loginBtn.innerText = "Verifying...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "login",
            email: email,
            password: password,
            role: role
          })
        });

        const result = await response.json();

        if (result.success) {
          sessionStorage.setItem("erp_user", JSON.stringify(result.user));
          
          // Role Based Redirection
          const userType = result.user.UserType.toLowerCase();
          if (userType === "admin" || userType === "principal") {
            window.location.href = "admin-dashboard.html";
          } else if (userType === "faculty" || userType === "hod") {
            window.location.href = "faculty-dashboard.html";
          } else {
            window.location.href = "parent-dashboard.html";
          }
        } else {
          alertBox.innerText = result.error || "Login credentials invalid.";
          alertBox.style.display = "block";
        }
      } catch (err) {
        console.error(err);
        alertBox.innerText = "Network connection failed. Verify Apps Script URL.";
        alertBox.style.display = "block";
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = "Sign In to Dashboard";
      }
    });
  </script>
</body>
</html>
