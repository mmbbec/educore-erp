<!-- ADMISSION ACTION HEADER -->
<div class="flex items-center justify-between mb-4">
  <div>
    <h3 class="text-lg font-bold text-slate-900">Student Directory & Admissions</h3>
    <p class="text-xs text-slate-500">Manage institutional student enrollments</p>
  </div>
  <button onclick="openEnrollModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-semibold text-sm shadow-sm transition">
    <span class="material-symbols-outlined text-sm">person_add</span>
    New Admission
  </button>
</div>

<!-- STUDENT ADMISSION MODAL -->
<div id="enrollModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden">
  <div class="bg-white rounded-2xl w-full max-w-2xl mx-4 overflow-hidden shadow-2xl border border-slate-100 flex flex-col max-h-[90vh]">
    
    <!-- Modal Header -->
    <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
      <div>
        <h3 class="text-lg font-bold text-slate-800">New Student Admission</h3>
        <p class="text-xs text-slate-500">Auto-generates Student ID, USERS account & initial fee ledger</p>
      </div>
      <button onclick="closeEnrollModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <!-- Modal Form Body (Scrollable) -->
    <form id="enrollStudentForm" class="p-6 overflow-y-auto space-y-4">
      <div id="modalAlert" class="hidden p-3 text-xs font-semibold rounded-lg"></div>

      <!-- Row 1: Full Name & USN / Roll Number -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name *</label>
          <input type="text" id="stuName" required placeholder="e.g. Ramesh Patil" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Admission / Roll No (USN) *</label>
          <input type="text" id="stuAdmissionNo" required placeholder="e.g. 2BA22CS045" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
      </div>

      <!-- Row 2: Email & Phone -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address *</label>
          <input type="email" id="stuEmail" required placeholder="student@example.com" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Mobile Contact *</label>
          <input type="tel" id="stuMobile" required placeholder="9876543210" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none">
        </div>
      </div>

      <!-- Row 3: Gender & DOB -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Gender *</label>
          <select id="stuGender" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Date of Birth</label>
          <input type="date" id="stuDOB" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <!-- Row 4: Department, Semester & Section -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Department *</label>
          <select id="stuDept" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="CSE">Computer Science (CSE)</option>
            <option value="ISE">Information Science (ISE)</option>
            <option value="ECE">Electronics (ECE)</option>
            <option value="MECH">Mechanical (MECH)</option>
            <option value="CIVIL">Civil (CIVIL)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Semester *</label>
          <select id="stuSemester" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="1">1st Semester</option>
            <option value="2">2nd Semester</option>
            <option value="3">3rd Semester</option>
            <option value="4">4th Semester</option>
            <option value="5">5th Semester</option>
            <option value="6">6th Semester</option>
            <option value="7">7th Semester</option>
            <option value="8">8th Semester</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Section *</label>
          <select id="stuSection" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="A">Section A</option>
            <option value="B">Section B</option>
            <option value="C">Section C</option>
          </select>
        </div>
      </div>

      <!-- Row 5: Academic Year & Total Fee -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Academic Year</label>
          <input type="text" id="stuAcademicYear" value="2026-2027" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Annual Fee Structure (₹)</label>
          <input type="number" id="stuTotalFee" value="55000" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
        <button type="button" onclick="closeEnrollModal()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold text-sm transition">
          Cancel
        </button>
        <button type="submit" id="enrollSubmitBtn" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold text-sm shadow-sm transition">
          Confirm Admission
        </button>
      </div>
    </form>

  </div>
</div>
