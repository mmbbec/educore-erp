<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCore ERP - Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background: #f8fafc; color: #1e293b; }
    .navbar {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar h2 { font-size: 1.25rem; font-weight: 700; color: #0f172a; }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 1rem;
      font-size: 0.875rem;
      font-weight: 500;
    }
    .btn-logout {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-logout:hover { background: #e2e8f0; }
    .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
    .grid-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }
    .stat-title { font-size: 0.875rem; color: #64748b; font-weight: 600; }
    .stat-value { font-size: 1.875rem; font-weight: 700; margin-top: 0.5rem; color: #0f172a; }
    .section-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid #e2e8f0;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
      margin-bottom: 1.5rem;
    }
    .section-card h3 { font-size: 1.1rem; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid #f1f5f9; font-size: 0.875rem; }
    th { color: #64748b; font-weight: 600; background: #f8fafc; }
  </style>
</head>
<body>

  <header class="navbar">
    <h2>EduCore ERP Administration</h2>
    <div class="user-pill">
      <span id="userName">Admin User</span>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </header>

  <main class="container">
    <div class="grid-stats">
      <div class="stat-card">
        <div class="stat-title">Total Active Students</div>
        <div class="stat-value" id="statStudents">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Total Faculty</div>
        <div class="stat-value" id="statFaculty">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Today's Attendance</div>
        <div class="stat-value" id="statAttendance">--%</div>
      </div>
      <div class="stat-card">
        <div class="stat-title">Total Fees Collected</div>
        <div class="stat-value" id="statFees">₹--</div>
      </div>
    </div>

    <div class="section-card">
      <h3>Academic Departments</h3>
      <table id="deptTable">
        <thead>
          <tr>
            <th>Department Code</th>
            <th>Department Name</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="deptList">
          <tr><td colspan="3" style="text-align: center; color: #94a3b8;">Loading department records...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwW62c3BqM9V5bY5T50Qz5eE-example/exec";

    // Authentication Guard
    const userSession = JSON.parse(sessionStorage.getItem("erp_user"));
    if (!userSession) {
      window.location.href = "index.html";
    } else {
      document.getElementById("userName").innerText = `${userSession.Name} (${userSession.UserType})`;
    }

    function logout() {
      sessionStorage.removeItem("erp_user");
      window.location.href = "index.html";
    }

    async function loadDashboardMetrics() {
      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "dashboard" })
        });

        const result = await response.json();

        if (result.success && result.dashboard) {
          const stats = result.dashboard;
          document.getElementById("statStudents").innerText = stats.totalStudents;
          document.getElementById("statFaculty").innerText = stats.totalFaculty;
          document.getElementById("statAttendance").innerText = stats.attendanceToday + "%";
          document.getElementById("statFees").innerText = "₹" + stats.paidFees.toLocaleString();

          // Render Departments
          const tbody = document.getElementById("deptList");
          tbody.innerHTML = "";
          if (stats.departments && stats.departments.length > 0) {
            stats.departments.forEach(dept => {
              const row = `<tr>
                <td><strong>${dept.DepartmentCode || '-'}</strong></td>
                <td>${dept.DepartmentName || '-'}</td>
                <td>${dept.Status || 'Active'}</td>
              </tr>`;
              tbody.innerHTML += row;
            });
          } else {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #94a3b8;">No departments configured in DEPARTMENTS sheet.</td></tr>`;
          }
        }
      } catch (err) {
        console.error("Dashboard error:", err);
      }
    }

    window.addEventListener("DOMContentLoaded", loadDashboardMetrics);
  </script>
</body>
</html>
